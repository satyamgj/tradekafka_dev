server:
  port: 1028
  servlet-path: /static-data
  
logging:
  level:
    root: info
  
spring:
  config:
    import:
    - configserver:http://root:s3cr3t@127.0.0.1:1025
  application:
    name: broker-service
  cloud:
    config:
      profile: test
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
  jpa:
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
  main:
    allow-bean-definition-overriding: true
app:
  consumer-topic-name: static-data-request
  producer-topic-name: static-data-response
  
springdoc:
  api-docs:
    path: /api-docs
  use-fqn: true